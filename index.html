<script>
'use strict';
const articles=[
{id:'ai',label:'选词填空',title:'当 AI 超越人类，我们还剩下什么？',sub:'AI · 人类创造力 · 工作变革',range:'26—35',summary:'科学不断打破人类独特性的神话。AI 并非会一刀切地取代所有人：有的领域看重人类参与，有的领域重视结果，有的会形成混合协作。',structure:[['① 破题','人类并非唯一会使用工具和传播文化的物种。'],['② 技术推进','技术逐渐证明机器也能执行认知任务，AI 的能力正在逼近人类。'],['③ 三种未来','保留人类参与、人工技能变得多余、人与机器共存的混合领域。'],['④ 职业影响','部分岗位消失，创造性能力及技术所有权带来新的价值分配。']],paras:[
{en:'We humans love to believe we are special, but science and technology have repeatedly proved this conviction wrong. People once thought that humans were the only animals to use tools, to form teams or to propagate culture, but science has shown that other animals do each of these things.',cn:'我们人类喜欢相信自己是特别的，但科学技术一再证明这种信念是错误的。人们曾以为，只有人类才会使用工具、组成团队或传播文化；然而，科学已经证明其他动物同样会做这些事情。',point:'once 作副词表示「曾经」，和后面的 but / has shown 构成过去认知与现在事实的对比。',tags:['once','conviction','propagate']},
{en:'Meanwhile, technology has quashed, one by one, claims that cognitive tasks require a human brain. The first adding machine was invented in 1623. This past year, a computer-generated work won an art contest. I believe the moment when computers meet and surpass human intelligence is on the horizon.',cn:'与此同时，技术逐一推翻了「认知任务必须依赖人脑」的说法。第一台加法机发明于1623年；过去这一年，一件计算机生成的作品赢得了艺术比赛。我相信计算机达到并超越人类智能的时刻已近在眼前。',point:'claims that ... 是解释 claims 内容的同位语从句；meet and surpass 为并列谓语；on the horizon 表示「即将到来」。',tags:['cognitive','surpass','quash']},
{en:'How will human intelligence and creativity be valued when machines become smarter and more creative than the brightest people? There will likely be a spectrum. In some domains people still value humans doing things, even if a computer can do it better. It’s been a quarter of a century since a computer beat world champion Garry Kasparov, but human chess hasn’t gone away.',cn:'当机器比最聪明的人还聪明、更有创造力时，人类智慧和创造力将如何被评价？答案很可能呈现多种情况。在一些领域，人们仍然珍视人类亲自做事，即使计算机做得更好。计算机击败国际象棋世界冠军卡斯帕罗夫已经过去四分之一个世纪，但人类的国际象棋活动并未消失。',point:'in some domains 表示「在某些领域」；even if 引导让步状语从句，意为「即使」。',tags:['domains','spectrum']},
{en:'In other fields, human skill will seem costly and redundant. Take illustration for example: most readers don’t care whether the graphic accompanying a magazine article was drawn by a person or a computer—they just want it to be relevant, new and perhaps entertaining.',cn:'在其他领域，人类技能将显得昂贵而且不再必要。以插画为例，大多数读者并不在乎杂志文章的配图由人还是计算机绘制——他们只希望它切题、新颖，或许还要有趣。',point:'accompanying a magazine article 是现在分词短语后置修饰 graphic，相当于 that accompanies a magazine article。',tags:['redundant','accompanying','entertaining']},
{en:'And, of course, this question isn’t black or white. Many fields will be a hybrid, where some humans find a lucky place, but most of the work is done by computers, like in manufacturing today, where much of the work is accomplished by robots, but some humans must be there to oversee the machines.',cn:'当然，这个问题并不是非黑即白。许多领域将是一种混合模式：少数人能够找到自己的位置，但大部分工作由计算机完成。正如今天的制造业，大量工作由机器人完成，但仍然需要一些人监督机器。',point:'hybrid（混合体）呼应「非黑即白」；oversee（监督）是人类保留的职责。where 引出说明具体领域或情形的从句。',tags:['hybrid','oversee']},
{en:'If history is any guide, it’s almost certain that advances in AI will cause more jobs to vanish, that creative workers with human-only skills will become richer but fewer in number, and that those who own creative technology will become the new ultra-rich.',cn:'如果历史可以作为参考，那么几乎可以肯定：AI 的进步将使更多工作岗位消失；拥有独特创造技能的工作者将更富有，但人数更少；掌握创造性技术所有权的人则将成为新的超级富豪。',point:'If history is any guide = 如果历史可作参考。后面三个 that 从句并列；cause + 宾语 + to do 表示「导致……做某事」。',tags:['vanish','ultra-rich']}
]},
{id:'advice',label:'仔细阅读',title:'为什么有人总爱给你提建议？',sub:'心理 · 边界感 · 自我调节',range:'51—55',summary:'有的人是真心想帮忙，有的人把提建议当成获取价值感和控制感的方式。应对关键不是服从或攻击，而是理解其动机、温和表达边界。',structure:[['① 解释原因','善意与权力感需求都可能促使人反复给建议。'],['② 深层心理','部分提建议者情绪脆弱、渴望认可。'],['③ 冲突机制','直接攻击与否定可能触发防御反应。'],['④ 解决方法','认可出发点、明确边界、保持自我调节，减少冲突。']],paras:[
{en:'People who repeatedly give unwanted advice can be well-meaning and genuinely want to help. Others might do this out of a sense of self-worth around the ability to influence others. One study found that people with a high tendency to seek power were more likely to give advice than those with an opposite tendency.',cn:'那些反复给出不请自来建议的人，可能确实出于好意，真心想帮忙。另一些人这样做，是因为影响他人的能力能带给他们自我价值感。一项研究发现，权力欲较强的人比倾向相反的人更可能提建议。',point:'more likely to... than... 表比较；seek power = crave for power（渴望权力），对应51题。',tags:['well-meaning','genuinely','self-worth','tendency']},
{en:'Under the guise of unselfishness, people may be driven to give you unwanted advice because it makes them feel powerful or in control. They may not be fully aware of this drive, however.',cn:'有些人打着无私的幌子，受到内在动机驱使，向你提供并未征求的建议，因为这让他们感觉更有权力或掌控感。不过，他们自己未必充分意识到这种动机。',point:'under the guise of = 以……为幌子；be driven to do = 受驱使做某事。',tags:['guise','unselfishness','drive']},
{en:'These people may also display a problematic degree of emotional vulnerability, becoming upset very quickly, and taking a long time to calm down. It is possible that their emotions were only validated in childhood when they were at their loudest, encouraging them to adopt responses to discomfort that are excessive in most situations.',cn:'这些人也可能表现出较严重的情绪脆弱性：很容易感到烦躁，需要很长时间才能平静。有可能在他们童年时，只有情绪表达最强烈的时候才会被认可，于是他们学会了在多数场景中过度回应不适。',point:'emotional vulnerability = emotionally vulnerable，对应52题；becoming / taking / encouraging 等分词补充说明前文。',tags:['vulnerability','validate','excessive']},
{en:'When someone is giving advice in order to make themselves feel more powerful, there is underlying anxiety to their behavior that recipients of the advice tend to notice. It can be tempting in this situation to react harshly to the advice giver and to accuse them of being manipulative, but this approach might produce an undesirable result.',cn:'当一个人靠给建议让自己感觉更有权力时，这种行为背后的焦虑往往会被建议接受者察觉。在这种情况下，人们可能忍不住严厉回应，甚至指责对方想要操控别人，但这种做法可能带来不好的结果。',point:'accuse sb. of doing = 指责某人做某事；manipulative ↔ trying to control others，定位53题。',tags:['underlying','recipient','manipulative']},
{en:'If the act of giving advice is contributing actively to someone’s feelings of self-worth, an outright rejection may be perceived as a threat, activating their fight-or-flight response, possibly causing them to double down on their validation-seeking behavior, or leading to a larger conflict.',cn:'如果给建议有助于一个人获得自我价值感，那么直截了当的拒绝可能会被他视为威胁，激活战斗或逃跑反应，甚至使他更坚持寻求认可的行为，或引发更大的冲突。',point:'be perceived as = be regarded as「被视为」；double down on = 更加坚持；定位54题。',tags:['rejection','perceive','double down on']},
{en:'The key is to validate without over-identifying. You can let them know that you have heard them and appreciate where they are coming from without taking on the potentially damaging narrative that you could not have gotten by without their help. You had better say something like, “Thanks for the idea. I have my own plan for handling this, but I really appreciate your perspective and will take it into consideration. Can I let you know when I need help in the future?”',cn:'关键在于认可对方，却不过度认同。你可以告诉他们：你听到了建议，也理解他们的出发点；但不必接受那种可能有害的观念——仿佛没有他们的帮助你就无法应付过去。你可以说：「谢谢你的想法。我有自己的处理计划，但很感谢你的视角，也会考虑。将来我需要帮助时再告诉你，好吗？」',point:'重点长难句：let sb. know that...；appreciate where sb. is coming from = 理解某人出发点；without taking on...；that you could not have gotten by... 是解释 narrative 内容的同位语从句。',tags:['perspective','appreciate','take into consideration']},
{en:'If you have trouble setting boundaries tactfully, prioritize working on your own ability to self-regulate. As uncomfortable as it may make you continuously receiving unwanted advice, if you can respond with compassion, the situation will likely diffuse much faster.',cn:'如果你很难得体地划清界限，就应优先训练自我调节能力。持续收到不请自来的建议固然令人不适，但若能带着同理心回应，局面很可能会更快缓和。',point:'have trouble doing = 做某事有困难；As + 形容词 + as... 是让步结构，≈ Although...；self-regulate = 自我调节。',tags:['boundaries','tactfully','compassion']},
{en:'Though it is usually not the intended outcome of giving unsolicited advice, many who receive it often feel stressed, offended, or simply annoyed by unwanted suggestions. Setting a boundary in this regard, if you feel you need one, is perfectly reasonable and something that can bring you increased emotional safety.',cn:'虽然这通常不是主动给建议者想看到的结果，但许多接受建议的人会因这些话而感到压力、受冒犯或烦躁。如果你觉得有必要，在这方面设定边界完全合理，也能够增加情绪上的安全感。',point:'Though 引导让步；Setting a boundary... 为动名词短语作主语；if you feel you need one 为插入条件信息。',tags:['unsolicited','offended','reasonable']},
{en:'It is best to set boundaries in a way that takes into account the individual’s underlying reasons for doing what they are doing to avoid unnecessary conflict and more stress.',cn:'最好在设定边界时，考虑对方行为背后的深层原因，从而避免不必要的冲突与更多压力。',point:'in a way that... 为定语从句；take into account = 考虑到；underlying reasons = 深层原因，定位55题。',tags:['take into account','underlying','conflict']}
]},
{"id":"accent","label":"第三套 · 选词填空","title":"口音与标准英语：标准真的存在吗？","sub":"语言学 · 口音与方言 · 语言标准","range":"26—35","summary":"口音与方言相关但并不等同。语言学家指出“唯一标准口音”更多是一种理想，而这一观念依然影响工作场所对语言的评价。","structure":[["① 区分口音与方言","accent 主要指发音，dialect 包括词汇和词序。"],["② 理想与现实","所谓的唯一标准是一种理想而非现实。"],["③ 标准随时空变化","不同时间、不同地区有多种所谓标准。"],["④ 社会影响","标准口音观念影响职业领域对非标准口音的接受度。"]],"paras":[{"en":"It's best to think of an accent as a distinct, systematic and rule-governed way of speaking. Accent is not a synonym for dialect, but it's related. Dialect is an umbrella term for the way a community pronounces words, creates words, and orders words; accent refers to that first part only.","cn":"最好将口音理解为一种有自身特点、系统性且遵循规则的说话方式。口音不是方言的同义词，但两者相关。方言是描述群体发音、创造词汇和排列词语方式的总称；口音仅指其中的发音部分。","point":"26 N synonym：a synonym for 指“……的同义词”；accent 与 dialect 相关但不同。","tags":["accent","dialect","synonym","umbrella term"]},{"en":"Many laymen presume that there is a single standard way of speaking in each country, with one single standard accent, and that this perceived standard is inherently the best form of speech, but linguists often point out that the concept of a standard accent is better understood as an ideal rather than a reality. In other words, no one speaks “standard English”; rather, it is an imagined way of using language that exists only in grammar and style books.","cn":"许多非专业人士认为，每个国家都存在唯一标准的说话方式和口音，并认为这种所谓标准本质上是最好的表达方式。但语言学家指出，所谓的标准口音更应该被理解为理想而非现实。换句话说，所谓“标准英语”只存在于语法和风格指南中。","point":"27 G laymen：many + 复数名词；28 F inherently：副词；29 J reality：ideal rather than a reality。","tags":["laymen","presume","inherently","reality","perceived"]},{"en":"One reason linguists agree there is no one true standard is that, through the years, there have been multiple supposed standards, depending on time and place. The standard for English in British newsreels from the 1950s, for example, differs greatly from the standard found on American national news broadcasts today. In fact, there has never been a single standard that's been fully agreed upon—and broadcast outlets across the spectrum have never consistently held to those standards anyway.","cn":"语言学家认为不存在唯一真正标准的一个原因是，不同时间和地点一直有多种所谓标准。例如，20世纪50年代英国新闻短片的英语标准与今天美国全国新闻广播中的标准不同。实际上，从未有一种标准得到完全一致认可，各类广播机构也并未始终遵守同一标准。","point":"30 H multiple：多个的，修饰复数 standards；31 M spectrum：across the spectrum，涵盖各种类型。","tags":["multiple","newsreel","spectrum","broadcast outlet"]},{"en":"Even so, this idea of a standard accent is influential, and many workplace and educational environments perpetuate the idea that accents that deviate from the current standard are less appropriate, or even inappropriate. Scholars have found that southern U.S. accent features are more accepted in domains such as government, law and service-oriented workplaces, but less accepted in the technology sector. The acceptability of nonstandard accents may correlate with differences in class and culture, with newer or higher prestige industries expecting more standard speech in the workplace.","cn":"即便如此，标准口音的观念依然很有影响力。许多职场与教育环境继续认为偏离现行标准的口音不够合适，甚至不恰当。研究发现，美国南部口音的某些特征在政府、法律和服务行业更容易被接受，而在技术行业接受度较低。非标准口音的接受度可能与阶层和文化差异相关；新兴或声望较高的行业通常要求职场中更标准的语言。","point":"32 E influential；33 C deviate from；34 D domains；35 B correlate with。句末 with + industries + expecting 为主动关系的 with 复合结构。","tags":["influential","deviate","domains","correlate","prestige","perpetuate"]}]}
,
{"id":"driving","label":"听力复盘","paper":"2026 年 6 月 · 第一套","range":"23–25","title":"自动驾驶与安全接管","sub":"听力第三篇 · 文字复盘","summary":"抓住三个信息：研究目标、交通事故的原因，以及公众安全感下降的解释。","structure":[["研究目标","传感器评估驾驶员状态，以便车辆安全接管。"],["数据与态度","疲劳与道路事故有关，近期备受关注的事故影响了公众信心。"]],"paras":[{"en":"A Swedish team is testing sensors that track signs of tiredness, distraction and stress. The goal is to let the car take control safely when the person at the wheel is in no condition to drive.","cn":"瑞典研究团队在测试能识别疲劳、分心和压力迹象的传感器。驾驶员状态不适合继续开车时，车辆应能安全接管。","point":"第 23 题问目标。传感器是手段，安全接管才是目的。","tags":["take control of","driver fatigue"]},{"en":"EU figures discussed in the recording attribute up to one in five road crashes to tired drivers. Experts expect automation to help in the long run, but recent high-profile crashes have made drivers less confident about the technology.","cn":"录音提到的欧盟数据显示，最多约五分之一的道路事故被归因于驾驶员疲劳。专家预计自动驾驶长期能改善安全，但近期广受关注的事故让驾驶者信心下降。","point":"第 24 题定位 one in five 的原因。第 25 题用近期事故解释态度变化。","tags":["attribute to","high-profile"]}]},
{"id":"rent-caps","label":"选词填空","paper":"2026 年 6 月 · 第一套","range":"26–35","title":"租金上涨该不该设上限？","sub":"住房政策 · 租金管制","summary":"从华盛顿州的两项提案读懂租金限制、豁免情形和支持与反对双方的理由。","structure":[["提案","涨幅通常受通胀率限制，另有豁免情形。"],["支持理由","租金上涨与无家可归现象相关，议员以选民的经历举例。"],["反对意见","住房出租行业质疑政策成效及受益人分配。"]],"paras":[{"en":"Washington state lawmakers are considering two proposals to impose caps on rent increases. In most cases, landlords would be unable to raise rents faster than inflation. Newer buildings, public housing, major upgrades and hardship exemptions are exceptions.","cn":"华盛顿州议员在审议两项限制租金涨幅的提案。多数情况下，房东不能把房租涨得比通胀还快。较新的建筑、公共住房、重大翻修和困难豁免属于例外。","point":"第 26 题是复数主语后的动词 impose。第 27 题的 hardship 后接名词 exemption。","tags":["impose","hardship exemption","inflation","landlord"]},{"en":"A federal study estimated that a $100 increase in rent was correlated with a 9% rise in homelessness. The effects were especially severe for certain groups, including racial minorities.","cn":"一项联邦研究估计，租金每上涨 100 美元，与无家可归率上升 9% 相关。部分群体受到的影响尤其严重，包括少数族裔。","point":"第 28 题考 be correlated to。to 和 with 均可用于表达相关性。","tags":["correlated","correlate with","homelessness"]},{"en":"Representative Alex Ramel illustrated the devastating effect of double-digit increases with the case of a constituent in Bellingham. This young graduate was about to leave after his landlord notified him of a $600 monthly rent increase.","cn":"议员亚历克斯·拉梅尔用贝灵厄姆一位选民的遭遇说明两位数涨租的严重影响。这位刚毕业的年轻人接到房东通知，月租要涨 600 美元，因此打算搬走。","point":"第 29–31 题分别检查人物名词、修饰 effect 的形容词和叙述过去事件的动词。","tags":["constituent","devastating","notified","double-digit"]},{"en":"A rental housing association asserts that the proposals would do little to solve the problem. A housing coalition representative argues that rent control has failed wherever it has been enacted, has not fixed the problem anywhere, and fails to distinguish between income groups when determining who benefits.","cn":"当地租赁住房协会主张，这些提案对解决问题帮助不大。一名住房联盟代表认为，实施租金管制的地方都未解决住房难题，在决定谁能受益时也没有区分不同收入群体。","point":"第 32–35 题分别看主语单数、完成时被动、否定句副词和 when 后的省略。","tags":["asserts","enacted","anywhere","determining"]}]},
{"id":"digital-nomads","label":"段落匹配","paper":"2026 年 6 月 · 第一套","range":"36–45","title":"数字游民怎样边工作边旅行？","sub":"远程工作 · 按原卷 A–M 段归纳","summary":"跟着三个远程工作者，梳理选城市的方式、自由的边界和在地生活的收获。","structure":[["A–E · 谁在远程工作","从游客与游民的不同需求切入，介绍莱弗尔斯的社群。"],["F–I · 自由的边界","几个案例说明网速、工作责任与截止日期如何左右行动。"],["J–M · 在地经验","日常生活带来的文化理解、灵感和身份变化。"]],"paras":[{"en":"Remote work has made a beach hut or a city coffee shop a possible office. Working while moving from one place to another can still be difficult.","cn":"远程办公让海滨小屋或城市咖啡馆都可能成为办公室。边换地方边工作也会遇到难题。","point":"A 段是主题导入，概括远程工作的便利和挑战。","tags":["digital nomad","prevalence"]},{"en":"A typical visitor may drop their bags at the hotel and go online for opening hours or ideas about where to go.","cn":"普通游客可能先把行李放在酒店，再上网查景点开放时间或去哪儿玩。","point":"B 段从普通游客的行为写起。","tags":["tourist attraction"]},{"en":"Dutch developer Pieter Levels travels with a single backpack. Internet speed, climate, food and living costs all influence where he chooses to stay.","cn":"荷兰开发者彼得·莱弗尔斯带着一个背包旅行。网速、气候、饮食和生活成本都会影响他的落脚地。","point":"C 段介绍人物及其选择地点的标准。","tags":["at will","cost of living"]},{"en":"Levels started a members-only Slack channel called #nomads. People can ask others in the same city practical questions that rarely matter to holidaymakers.","cn":"莱弗尔斯创建了名为 #nomads 的 Slack 会员频道。用户可以向同城的人询问游客很少需要了解的实际问题。","point":"D 段定位聊天工具和数字游民的实际信息需求。","tags":["digital nomad"]},{"en":"Digital nomads are often self-employed and work remotely. Freelancing, the sharing economy and better digital tools are making this way of life possible for a rapidly growing number of people.","cn":"数字游民多为自由职业者，能远程办公。自由职业、共享经济和更好的数字工具让越来越多的人能过上这种生活。","point":"E 段既定义数字游民，也解释人数增长。","tags":["self-employed","sharing economy"]},{"en":"Nomads may enter on tourist visas, but unlike people on holiday, they bring their work responsibilities with them. Their jobs require neither constant travel nor a permanent base.","cn":"游民也可能持旅游签证入境，但他们随身带着工作任务。工作既不要求他们一直旅行，也不要求他们固定在一地。","point":"F 段的对比落在是否还要工作。","tags":["tourist visa"]},{"en":"Independent designer Janet Brent chooses short stays according to her budget. She explains that her trips are a personal choice and that staying longer can draw her into the local community.","cn":"独立设计师珍妮特·布伦特按预算选择短住地点。她说旅行是个人选择，停留得久一些能让她更多参与当地生活。","point":"G 段说明目的地主要由个人和预算决定。","tags":["short-term stay"]},{"en":"Developer Bryce Adams points out that his work needs fast, dependable internet. In practice, he often ends up in a well-connected urban space far from the picturesque beach he might prefer.","cn":"开发者布莱斯·亚当斯指出，他的工作需要快速可靠的网络。现实中他常待在网速有保障的城市空间里，离理想中的海滩很远。","point":"H 段通过理想场景和工作现实说明弊端。","tags":["downside","bandwidth"]},{"en":"Adams says outsiders overestimate the freedom of digital nomads. Deadlines, clients and family obligations still follow them across borders.","cn":"亚当斯说，外人高估了数字游民的自由。他们到了国外也得顾及截止日期、客户和家庭责任。","point":"I 段说明游民的行动自由受到责任约束。","tags":["deadline"]},{"en":"Going to a neighbourhood clinic or dealing with a local host may teach a nomad more about the culture than a museum visit. Reliable connections can also keep them in one city longer than tourists stay.","cn":"去社区诊所或跟本地房东打交道，有时比参观博物馆更能帮助游民了解当地文化。为了稳定的网络，他们在一座城市的停留时间也可能比游客更长。","point":"J 段用日常交往与参观博物馆作比较。","tags":["immigration office"]},{"en":"Remote work abroad often requires a useful passport, an online job and suitable equipment. Adams says that the wider perspective he gains also improves what he can offer professionally.","cn":"在国外远程办公往往需要通行便利的护照、可在线完成的工作以及合适的设备。亚当斯说，开阔的视野也让他能提供更好的专业服务。","point":"K 段先交代门槛，再写开阔眼界对工作的好处。","tags":["privilege","perspective"]},{"en":"Adams finds that travel keeps him inspired. He sees how people elsewhere come up with inventive solutions even when they have fewer options or resources.","cn":"亚当斯觉得旅行能给他持续的灵感。他看到其他地方的人即使选择和资源更少，也能想出有创意的办法。","point":"L 段把旅行、灵感和对不同解决方式的理解连起来。","tags":["stay inspired","constraint"]},{"en":"Levels says a life on the move has changed what citizenship means to him and whom he chooses to befriend. For some nomads, identity no longer revolves around just one address or nation.","cn":"莱弗尔斯说，四处迁居改变了他对公民身份的理解，也改变了他的交友圈。对部分游民来说，身份认同不再只围绕一个地址或一个国家。","point":"M 段收束到身份认同和交友选择。","tags":["citizenship"]}]},
{"id":"teen-social-media","label":"仔细阅读 · 社交媒体","paper":"2026 年 6 月 · 第一套","range":"46–50","title":"社交媒体与青少年心理健康","sub":"观点与证据 · 社论","summary":"辨认作者、研究人员和专家分别说了什么，尤其留意相关与因果的区别。","structure":[["立场","全面禁止青少年使用社交媒体既难实行也不可取。"],["证据","英国女孩的抑郁与使用时长相关。"],["应对","区分上网活动，改进平台监管，也要应对教育与医疗资源不足。"]],"paras":[{"en":"The editorial acknowledges that social media can cause problems for young people. Platforms should enforce their age rules, while keeping all teenagers away from services woven into daily life would be impractical and undesirable.","cn":"社论承认社交媒体可能给年轻人带来问题。平台应执行年龄门槛，而让所有青少年远离已经融入日常生活的服务，既难做到也不可取。","point":"第 46 题要区分低龄门槛与全面禁止。","tags":["impractical","undesirable"]},{"en":"Among British teenage girls, researchers found a link between heavier social media use and higher levels of depression. Two out of five girls used it for at least three hours daily. Online harassment and broken sleep also featured in the findings.","cn":"研究人员发现，英国十几岁女孩使用社交媒体的时间越长，抑郁表现越多。五分之二的女孩每天使用至少三小时。研究还提到网络骚扰和睡眠中断。","point":"第 47 题的关键信息是使用时长与抑郁相关。五分之二不足半数。","tags":["harassment","depression"]},{"en":"The author considers the association important even though the research did not establish causation. Schools can teach children about online abuse, but parents and professionals still struggle with broader questions about screen time.","cn":"虽然研究没有确立因果关系，作者仍然重视这项关联。学校可以教孩子识别网络侵害，家长和专业人士对更广泛的屏幕使用问题仍有疑惑。","point":"第 48 题问作者的评价，定位作者认为这项发现值得重视。","tags":["causation","screen time","underestimate"]},{"en":"Health secretary Matt Hancock proposed age and time guidance. Some experts doubted that simple limits would achieve much, because different online activities carry different risks. The editorial also called for stronger scrutiny of data collection and targeted advertising.","cn":"卫生大臣马特·汉考克提出制定年龄和时长指南。有些专家质疑简单限制的成效，因为不同上网活动的风险不同。社论也呼吁加强对数据收集和定向广告的监管。","point":"第 49 题问部分专家为何质疑方案。要看他们对一刀切的具体异议。","tags":["data harvesting","targeted advertising"]},{"en":"The final paragraph puts some of the responsibility beyond social media companies: schools and health services lack resources, and young people also face pressure to succeed. These problems belong in any serious discussion about protection.","cn":"末段把视野扩展到社交媒体公司之外：学校与医疗服务资源不足，年轻人还承受成功压力。这些都应纳入对青少年保护的讨论。","point":"第 50 题定位资源不足的学校和医疗服务。","tags":["under-resourced","safeguarding"]}]},
{"id":"tax-havens","label":"仔细阅读 · 避税天堂","paper":"2026 年 6 月 · 第一套","range":"51–55","title":"跨国企业为何把利润转到避税天堂？","sub":"企业税 · 研究与政策","summary":"按「过去的方案 → 利润转移证据 → 最低税率 → 短期推断」梳理作者的论证。","structure":[["原有行动","G20 试图限制跨国企业借避税地转移利润，成效有限。"],["研究证据","2019 年全球损失约 2,500 亿美元税收。"],["政策与推断","全球最低企业税率可削弱转移动机，美国当时尚未通过相应立法。"]],"paras":[{"en":"The G20 agreed to curb tax avoidance through offshore jurisdictions, including places such as the Bahamas and the Cayman Islands. Despite its action plan, the problem continued to grow.","cn":"二十国集团同意遏制利用巴哈马、开曼群岛等离岸地区避税的做法。虽然推出了行动计划，问题仍在加剧。","point":"第 51 题把政策目标和实际结果连起来。","tags":["crack down on","rein in","tax haven"]},{"en":"The researchers compared reported profits with local activity such as employment and production. They estimated that $969 billion, or 37% of the overseas profits of the largest multinationals, was shifted to tax havens in 2019. The growth of the tax avoidance industry and permissive U.S. policies helped drive the rise.","cn":"研究人员用就业、生产等当地实际活动与企业申报利润作比较。他们估计，2019 年最大的一批跨国企业把约 9,690 亿美元的境外利润转到了避税地，占其境外利润的 37%。避税行业的发展和美国较宽松的政策推动了增长。","point":"第 52 题问增长的原因。文章提到避税行业的发展与美国的政策，选项中只有后者吻合。","tags":["profit shifting","account for","lenient"]},{"en":"The authors estimated a worldwide tax loss of $250 billion in 2019. U.S. companies accounted for about half of it. For years, governments responded by gradually lowering corporate taxes and depending more heavily on consumption taxes.","cn":"作者估算，2019 年全球税收损失约 2,500 亿美元，美国企业约占一半。多年间，各国的应对方式是逐步降低企业税，并更多依赖消费税。","point":"第 53 题问一直在做什么，定位逐步降低企业税。","tags":["corporate tax","consumption tax","scrap"]},{"en":"The authors argue that a common minimum corporate tax would reduce the incentive to move profits. More than 130 countries backed a 15% minimum in 2021, but at the time of the article, corresponding legislation had not passed in the United States.","cn":"作者认为，统一的最低企业税率将削弱利润转移动机。130 多个国家在 2021 年支持 15% 的最低税率，但在文章写作时，美国尚未通过相关立法。","point":"第 54 题找作者提出的政策。第 55 题用美国尚未通过立法及其转移规模推断短期结果。","tags":["minimum tax rate","cease to exist"]}]},
{"id":"healthcare-tech","label":"汉译英","paper":"2026 年 6 月 · 第一套","range":"Part IV","title":"科技如何推动中国医疗发展？","sub":"参考译文 · 远程医疗、辅助诊断与电子档案","summary":"按意群练习汉译英，重点积累“让资源惠及”“辅助诊断”和“方便患者就医”的表达。","structure":[["总起与远程医疗","先写行业发展，再交代视频问诊和当地医生的协作。"],["诊断与档案","早期识别、诊断准确率和减少重复检查。"],["线上服务与总结","线上问诊方便就医，科技与医疗融合改善服务。"]],"paras":[{"en":"Scientific and technological advances have driven rapid development in China’s healthcare sector. In recent years, telemedicine has given more patients access to high-quality care. Specialists can consult with patients in remote areas by video and guide local doctors in developing and carrying out treatment plans.","cn":"科技进步推动中国医疗事业快速发展。近年来，远程医疗让更多患者用上优质医疗资源。医学专家可以通过视频为偏远地区的患者提供咨询，并指导当地医生制定和实施治疗方案。","point":"用 advances have driven rapid development 写首句。用 give patients access to 表达让患者用上某种资源。","tags":["healthcare sector","telemedicine","treatment plan"]},{"en":"AI-assisted diagnostic systems help doctors recognize early symptoms and improve diagnostic accuracy. The widespread use of electronic health records lets doctors review patients’ medical histories quickly and avoid repeating tests.","cn":"人工智能辅助诊断系统帮助医生识别早期症状，提高诊断准确率。电子健康档案的普及使医生能够快速查阅患者病史，避免重复检查。","point":"diagnostic accuracy 是名词搭配。avoid 后接动名词，例如 avoid repeating tests。","tags":["AI-assisted diagnosis","diagnostic accuracy","electronic health record","medical history"]},{"en":"Online consultation platforms have made it much easier for patients to seek medical care. By integrating technology into healthcare more fully, China is better able to meet people’s health needs.","cn":"线上医疗咨询平台让患者就医方便了许多。科技与医疗进一步融合，让中国更好地满足人民的健康需求。","point":"用 make it easier for somebody to do something 表达“让某人更容易做某事”。meet 搭配 needs。","tags":["seek medical care","meet health needs"]}],"translation":true}

  });

function reviewPage(){let wrongNums=Object.keys(state.mistakes).filter(k=>state.mistakes[k]>0),items=allQuizzes.filter(q=>wrongNums.includes(String(q.num))),known=Object.values(state.learned).filter(Boolean).length;return `${header('REVIEW · 巩固区','错题与复习记录','优先回顾曾经答错的知识点，然后返回文章精读和词汇卡片进行针对性强化。')}<div class="grid3" style="margin-top:24px"><div class="surface stat"><div class="lab">累计作答</div><div class="num accent">${state.attempts}</div></div><div class="surface stat"><div class="lab">累计答对</div><div class="num success">${state.correct}</div></div><div class="surface stat"><div class="lab">标记掌握</div><div class="num accent2">${known}</div></div></div><div class="section-head"><h2>待巩固错题</h2><p>${items.length} 道题曾经答错</p></div>${items.length?items.map(q=>`<div class="missed"><b>第${q.paperNo||q.num}题 · ${h(quizSections[q.section].label)}</b><p>${h(q.why)}</p><button class="linkbtn" data-action="retry-q" data-id="${q.num}">重新做这题 →</button></div>`).join(''):'<div class="surface empty">暂无错题记录。可以先去「真题训练」做一轮。</div>'}<div class="section-head"><h2>推荐复习策略</h2></div><div class="steps"><div class="step"><i>1</i><b>词性先行</b><p>识别动词、形容词、名词和副词的位置。</p></div><div class="step"><i>2</i><b>搭配积累</b><p>如 be perceived as、take into account。</p></div><div class="step"><i>3</i><b>每次查错因</b><p>分辨词义误判、语法误判、原文定位失败。</p></div></div><div class="toolbar" style="margin-top:22px"><button class="btn secondary" data-action="page" data-id="vocab">去背词汇 →</button><button class="btn secondary" data-action="page" data-id="quiz">继续刷题 →</button><button class="btn ghost" data-action="export-progress">导出进度 ↓</button><button class="btn ghost" data-action="import-progress">导入进度 ↑</button><button class="btn ghost" data-action="reset-data">清空学习记录</button><input id="progressImport" class="hidden" type="file" accept=".json,application/json" aria-label="选择学习进度备份文件"></div>`}
let quizFinish=false;
function quizResults(){let qs=quizQuestions(),answered=qs.filter(q=>state.selected[q.num]!==undefined),correct=answered.filter(q=>state.selected[q.num]===q.answer),notanswered=qs.filter(q=>state.selected[q.num]===undefined);return `${header('PRACTICE · 一轮结束','这一轮练习回顾','只统计当前模式中已经作答的题目。你可以回看任一道题，或选择重做本轮。')}<div class="scoreboard" style="margin-top:24px"><strong>${correct.length}<span style="font-size:24px;color:#9da3bc"> / ${qs.length}</span></strong><p>已选答案正确 ${correct.length} 道 · 未作答 ${notanswered.length} 道</p><div class="toolbar" style="justify-content:center"><button class="btn" data-action="restart-quiz">重新做本轮</button><button class="btn secondary" data-action="page" data-id="review">错题复习</button></div></div><div class="section-head"><h2>本轮题目速查</h2></div><div class="word-list">${qs.map(q=>`<button class="word" style="text-align:left;align-items:center" data-action="retry-q" data-id="${q.num}"><span style="font-weight:800">${h(quizSections[q.section].label)} · 第 ${q.paperNo||q.num} 题</span><span style="font-size:13px;color:${state.selected[q.num]===q.answer?'#087d76':'#b53d49'}">${state.selected[q.num]===undefined?'未作答':state.selected[q.num]===q.answer?'✓ 正确':'✕ 待巩固'} · 答案 ${answerLetters[q.answer]}</span></button>`).join('')}</div>`}
function render(keepScroll=false){document.querySelectorAll('.navbtn[data-page]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.page===state.page);btn.setAttribute('aria-current',btn.dataset.page===state.page?'page':'false')});let pages={home,reading,vocab:vocabulary,grammar:grammarPage,quiz:quizFinish?quizResults:()=>quizPage(keepScroll && $('#quizContext')?.open, keepScroll && $('#quizOptionMeanings')?.open),review:reviewPage};$('#pageRoot').innerHTML=pages[state.page]();if(state.page==='vocab'){$('#vocabSearch').addEventListener('input',e=>{let selection=e.target.selectionStart;state.query=e.target.value;state.flashIndex=0;state.flipped=false;render(true);let inp=$('#vocabSearch');inp.focus();inp.setSelectionRange(selection,selection)})}updateSidebar();if(!keepScroll)window.scrollTo({top:0,behavior:'instant'})}
function page(name){state.page=name;quizFinish=false;render()}
function selectQuiz(qnum){state.quizMode='all';state.quizIndex=allQuizzes.findIndex(q=>q.num===qnum);state.page='quiz';state.submitted=false;quizFinish=false;render()}
document.addEventListener('click',e=>{let btn=e.target.closest('button[data-action],button[data-page]');if(!btn)return;if(btn.dataset.page){page(btn.dataset.page);return}let action=btn.dataset.action,id=btn.dataset.id;
switch(action){case 'page':page(id);return;case 'read-article':state.article=id;state.paragraph=0;page('reading');return;case 'article':state.article=id;state.paragraph=0;break;case 'lang':state.lang=!state.lang;break;case 'prev-para':state.paragraph=Math.max(0,state.paragraph-1);break;case 'next-para':state.paragraph=(state.paragraph+1)%currentArticle().paras.length;break;case 'goto-para':state.paragraph=+btn.dataset.index;break;case 'mark-seen':{let k=state.article+'-'+state.paragraph;state.seen[k]=!state.seen[k];persist();break}case 'lookup':state.query=btn.dataset.word;state.vocabFilter='all';state.view='list';page('vocab');return;case 'vocab-article':state.article=id;state.flashIndex=0;state.flipped=false;break;case 'view':state.view=id;state.flipped=false;break;case 'filter':state.vocabFilter=id;state.flashIndex=0;state.flipped=false;break;case 'mark-word':state.learned[id]=!state.learned[id];persist();break;case 'flip':state.flipped=!state.flipped;break;case 'flash-prev':state.flashIndex=Math.max(0,state.flashIndex-1);state.flipped=false;break;case 'flash-next':{let list=filteredWords();state.flashIndex=(state.flashIndex+1)%list.length;state.flipped=false;break}case 'toggle-grammar':state.grammarOpen[id]=!state.grammarOpen[id];break;case 'quiz-mode':state.quizMode=id;state.quizIndex=0;state.submitted=false;state.selected={};quizFinish=false;if(state.page!=='quiz'){page('quiz');return}break;case 'answer':if(!state.submitted){let q=quizQuestions()[state.quizIndex];state.selected[q.num]=+id}break;case 'quiz-submit':{let q=quizQuestions()[state.quizIndex];if(state.selected[q.num]===undefined||state.submitted)return;state.submitted=true;state.attempts++;if(state.selected[q.num]===q.answer)state.correct++;else state.mistakes[q.num]=(state.mistakes[q.num]||0)+1;persist();break}case 'quiz-prev':state.quizIndex=Math.max(0,state.quizIndex-1);state.submitted=false;break;case 'quiz-next':if(state.quizIndex===quizQuestions().length-1){quizFinish=true}else{state.quizIndex++;state.submitted=false}break;case 'restart-quiz':state.selected={};state.submitted=false;state.quizIndex=0;quizFinish=false;break;case 'retry-q':selectQuiz(+id);return;case 'export-progress':{
  const backup={format:'cet6-reading-lab',version:1,exportedAt:new Date().toISOString(),data:{learned:state.learned,seen:state.seen,mistakes:state.mistakes,attempts:state.attempts,correct:state.correct}};
  const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download='cet6-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
}case 'import-progress':document.getElementById('progressImport').click();return;
case 'reset-data':if(confirm('确定清空本地学习记录？已掌握词汇、精读记录和错题记录都会被删除。')){state.learned={};state.seen={};state.mistakes={};state.attempts=0;state.correct=0;state.selected={};persist()}break;default:return}render(action==='answer'||action==='quiz-submit'||action==='flip'||action==='mark-word'||action==='toggle-grammar'||action==='mark-seen')});
document.addEventListener('change',async event=>{
 if(event.target.id!=='progressImport')return;
 const file=event.target.files&&event.target.files[0];if(!file)return;
 try{
  if(file.size>1024*1024)throw new Error('备份文件过大');
  const raw=JSON.parse(await file.text());
  const data=raw&&raw.format==='cet6-reading-lab'?raw.data:raw;
  if(!data||typeof data!=='object'||Array.isArray(data)||
     !['learned','seen','mistakes'].every(key=>data[key]&&typeof data[key]==='object'&&!Array.isArray(data[key]))||
     !Number.isInteger(data.attempts)||!Number.isInteger(data.correct)||data.attempts<0||data.correct<0||data.correct>data.attempts)
    throw new Error('文件格式不符合本站学习记录');
  if(!confirm('导入将覆盖此浏览器当前的学习进度。建议先导出备份。确定继续？'))return;
  const plain=key=>Object.fromEntries(Object.entries(data[key]).filter(([k,v])=>k!=='__proto__'&&k!=='constructor'&&k!=='prototype'&&(typeof v==='boolean'||(key==='mistakes'&&Number.isInteger(v)&&v>=0))));
  state.learned=plain('learned');state.seen=plain('seen');state.mistakes=plain('mistakes');
  state.attempts=data.attempts;state.correct=data.correct;persist();render();alert('学习进度已成功导入。');
 }catch(err){alert('无法导入学习进度：'+err.message)}
});
render();
</script>
</body></html>
