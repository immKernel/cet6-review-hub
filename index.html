<script>
'use strict';
const articles=[
{id:'ai',label:'选词填空',title:'当 AI 超越人类，我们还剩下什么？',sub:'AI · 人类创造力 · 工作变革',range:'26—35',summary:'科学不断打破人类独特性的神话。AI 并非会一刀切地取代所有人：有的领域看重人类参与，有的领域重视结果，有的会形成混合协作。',structure:[['① 破题','人类并非唯一会使用工具和传播文化的物种。'],['② 技术推进','技术逐渐证明机器也能执行认知任务，AI 的能力正在逼近人类。'],['③ 三种未来','保留人类参与、人工技能变得多余、人与机器共存的混合领域。'],['④ 职业影响','部分岗位消失，创造性能力及技术所有权带来新的价值分配。']],paras:[
{en:'We humans love to believe we are special, but science and technology have repeatedly proved this conviction wrong. People once thought that humans were the only animals to use tools, to form teams or to propagate culture, but science has shown that other animals do each of these things.',cn:'我们人类喜欢相信自己是特别的，但科学技术一再证明这种信念是错误的。人们曾以为，只有人类才会使用工具、组成团队或传播文化；然而，科学已经证明其他动物同样会做这些事情。',point:'once 作副词表示「曾经」，和后面的 but / has shown 构成过去认知与现在事实的对比。',tags:['once','conviction','propagate']},
{en:'Meanwhile, technology has quashed, one by one, claims that cognitive tasks require a human brain. The first adding machine was invented in 1623. This past year, a computer-generated work won an art contest. I believe the moment when computers meet and surpass human intelligence is on the horizon.',cn:'与此同时，技术逐一推翻了「认知任务必须依赖人脑」的说法。第一台加法机发明于1623年；过去这一年，一件计算机生成的作品赢得了艺术比赛。我相信计算机达到并超越人类智能的时刻已近在眼前。',point:'claims that ... 是解释 claims 内容的同位语从句；meet and surpass 为并列谓语；on the horizon 表示「即将到来」。',tags:['cognitive','surpass','quash']},
{en:'How will human intelligence and creativity be valued when machines become smarter and more creative than the brightest people? There will likely be a spectrum. In some domains people still value humans doing things, even if a computer can do it better. It’s been a quarter of a century since a computer beat world champion Garry Kasparov, but human chess hasn’t gone away.',cn:'当机器比最聪明的人还聪明、更有创造力时，人类智慧和创造力将如何被评价？答案很可能呈现多种情况。在一些领域，人们仍然珍视人类亲自做事，即使计算机做得更好。计算机击败国际象棋世界冠军卡斯帕罗夫已经过去四分之一个世纪，但人类的国际象棋活动并未消失。',point:'in some domains 表示「在某些领域」；even if 引导让步状语从句，意为「即使」。',tags:['domains','spectrum']},
{en:'In other fields, human skill will seem costly and redundant. Take illustration for example: most readers don’t care whether the graphic accompanying a magazine article was drawn by a person or a computer—they just want it to be relevant, new and perhaps entertaining.',cn:'在其他领域，人类技能将显得昂贵而且不再必要。以插画为例，大多数读者并不在乎杂志文章的配图由人还是计算机绘制——他们只希望它切题、新颖，或许还要有趣。',point:'accompanying a magazine article 是现在分词短语后置修饰 graphic，相当于 that accompanies a magazine article。',tags:['redundant','accompanying','entertaining']},
{en:'And, of course, this question isn’t black or white. Many fields will be a hybrid, where some humans find a lucky place, but most of the work is done by computers, like in manufacturing today, where much of the work is accomplished by robots, but some humans must be there to oversee the machines.',cn:'当然，这个问题并不是非黑即白。许多领域将是一种混合模式：少数人能够找到自己的位置，但大部分工作由计算机完成。正如今天的制造业，大量工作由机器人完成，但仍然需要一些人监督机器。',point:'hybrid（混合体）呼应「非黑即白」；oversee（监督）是人类保留的职责。where 引出说明具体领域或情形的从句。',tags:['hybrid','oversee']},
{en:'If history is any guide, it’s almost certain that advances in AI will cause more jobs to vanish, that creative workers with human-only skills will become richer but fewer in number, and that those who own creative technology will become the new ultra-rich.',cn:'如果历史可以作为参考，那么几乎可以肯定：AI 的进步将使更多工作岗位消失；拥有独特创造技能的工作者将更富有，但人数更少；掌握创造性技术所有权的人则将成为新的超级富豪。',point:'If history is any guide = 如果历史可作参考。后面三个 that 从句并列；cause + 宾语 + to do 表示「导致……做某事」。',tags:['vanish','ultra-rich']}
]},
{id:'advice',label:'仔细阅读',title:'为什么有人总爱给你提建议？',sub:'心理 · 边界感 · 自我调节',range:'51—55',summary:'有的人是真心想帮忙，有的人把提建议当成获取价值感和控制感的方式。应对关键不是服从或攻击，而是理解其动机、温和表达边界。',structure:[['① 解释原因','善意与权力感需求都可能促使人反复给建议。'],['② 深层心理','部分提建议者情绪脆弱、渴望认可。'],['③ 冲突机制','直接攻击与否定可能触发防御反应。'],['④ 解决方法','认可出发点、明确边界、保持自我调节，减少冲突。']],paras:[
{en:'People who repeatedly give unwanted advice can be well-meaning and genuinely want to help. Others might do this out of a sense of self-worth around the ability to influence others. One study found that people with a high tendency to seek power were more likely to give advice than those with an opposite tendency.',cn:'那些反复给出不请自来建议的人，可能确实出于好意，真心想帮忙。另一些人这样做，是因为影响他人的能力能带给他们自我价值感。一项研究发现，权力欲较强的人比倾向相反的人更可能提建议。',point:'more likely to... than... 表比较；seek power = crave for power（渴望权力），对应51题。',tags:['well-meaning','genuinely','self-worth','tendency']},
{en:'Under the guise of unselfishness, people may be driven to give you unwanted advice because it makes them feel powerful or in control. They may not be fully aware of this drive, however.',cn:'有些人打着无私的幌子，受到内在动机驱使，向你提供并未征求的建议，因为这让他们感觉更有权力或掌控感。不过，他们自己未必充分意识到这种动机。',point:'under the guise of = 以……为幌子；be driven to do = 受驱使做某事。',tags:['guise','unselfishness','drive']},
{en:'These people may also display a problematic degree of emotional vulnerability, becoming upset very quickly, and taking a long time to calm down. It is possible that their emotions were only validated in childhood when they were at their loudest, encouraging them to adopt responses to discomfort that are excessive in most situations.',cn:'这些人也可能表现出较严重的情绪脆弱性：很容易感到烦躁，需要很长时间才能平静。有可能在他们童年时，只有情绪表达最强烈的时候才会被认可，于是他们学会了在多数场景中过度回应不适。',point:'emotional vulnerability = emotionally vulnerable，对应52题；becoming / taking / encouraging 等分词补充说明前文。',tags:['vulnerability','validate','excessive']},
{en:'When someone is giving advice in order to make themselves feel more powerful, there is underlying anxiety to their behavior that recipients of the advice tend to notice. It can be tempting in this situation to react harshly to the advice giver and to accuse them of being manipulative, but this approach might produce an undesirable result.',cn:'当一个人靠给建议让自己感觉更有权力时，这种行为背后的焦虑往往会被建议接受者察觉。在这种情况下，人们可能忍不住严厉回应，甚至指责对方想要操控别人，但这种做法可能带来不好的结果。',point:'accuse sb. of doing = 指责某人做某事；manipulative ↔ trying to control others，定位53题。',tags:['underlying','recipient','manipulative']},
{en:'If the act of giving advice is contributing actively to someone’s feelings of self-worth, an outright rejection may be perceived as a threat, activating their fight-or-flight response, possibly causing them to double down on their validation-seeking behavior, or leading to a larger conflict.',cn:'如果给建议有助于一个人获得自我价值感，那么直截了当的拒绝可能会被他视为威胁，激活战斗或逃跑反应，甚至使他更坚持寻求认可的行为，或引发更大的冲突。',point:'be perceived as = be regarded as「被视为」；double down on = 更加坚持；定位54题。',tags:['rejection','perceive','double down on']},
{en:'The key is to validate without over-identifying. You can let them know that you have heard them and appreciate where they are coming from without taking on the potentially damaging narrative that you could not have gotten by without their help. You had better say something like, “Thanks for the idea. I have my own plan for handling this, but I really appreciate your perspective and will take it into consideration. Can I let you know when I need help in the future?”',cn:'关键在于认可对方，却不过度认同。你可以告诉他们：你听到了建议，也理解他们的出发点；但不必接受那种可能有害的观念——仿佛没有他们的帮助你就无法应付过去。你可以说：「谢谢你的想法。我有自己的处理计划，但很感谢你的视角，也会考虑。将来我需要帮助时再告诉你，好吗？」',point:'重点长难句：let sb. know that...；appreciate where sb. is coming from = 理解某人出发点；without taking on...；that you could not have gotten by... 是解释 narrative 内容的同位语从句。',tags:['perspective','appreciate','take into consideration']},
{en:'If you have trouble setting boundaries tactfully, prioritize working on your own ability to self-regulate. As uncomfortable as it may make you continuously receiving unwanted advice, if you can respond with compassion, the situation will likely diffuse much faster.',cn:'如果你很难得体地划清界限，就应优先训练自我调节能力。持续收到不请自来的建议固然令人不适，但若能带着同理心回应，局面很可能会更快缓和。',point:'have trouble doing = 做某事有困难；As + 形容词 + as... 是让步结构，≈ Although...；self-regulate = 自我调节。',tags:['boundaries','tactfully','compassion']},
{en:'Though it is usually not the intended outcome of giving unsolicited advice, many who receive it often feel stressed, offended, or simply annoyed by unwanted suggestions. Setting a boundary in this regard, if you feel you need one, is perfectly reasonable and something that can bring you increased emotional safety.',cn:'虽然这通常不是主动给建议者想看到的结果，但许多接受建议的人会因这些话而感到压力、受冒犯或烦躁。如果你觉得有必要，在这方面设定边界完全合理，也能够增加情绪上的安全感。',point:'Though 引导让步；Setting a boundary... 为动名词短语作主语；if you feel you need one 为插入条件信息。',tags:['unsolicited','offended','reasonable']},
{en:'It is best to set boundaries in a way that takes into account the individual’s underlying reasons for doing what they are doing to avoid unnecessary conflict and more stress.',cn:'最好在设定边界时，考虑对方行为背后的深层原因，从而避免不必要的冲突与更多压力。',point:'in a way that... 为定语从句；take into account = 考虑到；underlying reasons = 深层原因，定位55题。',tags:['take into account','underlying','conflict']}
]}
];

  if(!confirm('导入将覆盖此浏览器当前的学习进度。建议先导出备份。确定继续？'))return;
  const plain=key=>Object.fromEntries(Object.entries(data[key]).filter(([k,v])=>k!=='__proto__'&&k!=='constructor'&&k!=='prototype'&&(typeof v==='boolean'||(key==='mistakes'&&Number.isInteger(v)&&v>=0))));
  state.learned=plain('learned');state.seen=plain('seen');state.mistakes=plain('mistakes');
  state.attempts=data.attempts;state.correct=data.correct;persist();render();alert('学习进度已成功导入。');
 }catch(err){alert('无法导入学习进度：'+err.message)}
});
render();
</script>
